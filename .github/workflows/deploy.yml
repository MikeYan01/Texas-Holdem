# Build, verify, and publish to GitHub Pages.
#
# The test run is a gate rather than a nicety: ADR-0004 makes the exhaustive
# verification of the hand evaluator a CI requirement, because it is the entire
# basis for the decision to write our own. `check:all` is typecheck, the engine
# boundary check, and every test including the slow ones — about half a minute.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, engine boundary, and the whole test suite
        run: npm run check:all

      - name: Build
        run: npm run build

      # Pages must already be enabled on the repository, with its source set to
      # GitHub Actions. The default GITHUB_TOKEN cannot create the site itself —
      # it gets "Resource not accessible by integration" — so `enablement: true`
      # only turns a one-time setup step into a recurring red build.
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
